<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ExamMixer - Đại Dương Tri Thức</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
    height: 100dvh; 
    overflow: hidden; 
    color: #1e293b;
    position: relative;
  }

  /* --- HIỆU ỨNG ĐẠI DƯƠNG --- */
  .bubble {
    position: absolute; bottom: -50px; background: rgba(255,255,255,0.3);
    border-radius: 50%; animation: floatUp linear infinite; z-index: 0;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 0.8; }
    100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
  }

  .dolphin { position: absolute; z-index: 1; pointer-events: none; }
  .dolphin-1 { width: 120px; top: 15%; animation: swim 18s linear infinite; }
  .dolphin-2 { width: 80px; top: 65%; animation: swim 25s linear infinite reverse; opacity: 0.7; }
  @keyframes swim {
    0% { transform: translateX(-150px) scaleX(1); }
    45% { transform: translateX(100vw) scaleX(1); }
    50% { transform: translateX(100vw) scaleX(-1); }
    95% { transform: translateX(-150px) scaleX(-1); }
    100% { transform: translateX(-150px) scaleX(1); }
  }

  /* --- LAYOUT CHÍNH --- */
  .app-container {
    position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column;
  }

  /* --- HEADER --- */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 20px; background: rgba(255,255,255,0.4); backdrop-filter: blur(10px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.05); z-index: 20;
  }
  .header h1 { font-size: 18px; color: #0369a1; display: flex; align-items: center; gap: 8px; }
  .menu-btn { background: none; border: none; font-size: 24px; color: #0369a1; cursor: pointer; }

  /* --- SCREENS --- */
  .screen {
    flex: 1; display: none; flex-direction: column; padding: 20px;
    overflow-y: auto; overflow-x: hidden;
  }
  .screen.active { display: flex; animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .card {
    background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
    border-radius: 20px; padding: 20px; margin-bottom: 15px;
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1); border: 1px solid rgba(255,255,255,0.6);
  }
  .card h2 { font-size: 18px; color: #0284c7; margin-bottom: 15px; text-align: center; }

  /* --- BUTTONS --- */
  .btn {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    font-family: 'Quicksand', sans-serif; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
  }
  .btn.primary { background: linear-gradient(135deg, #0ea5e9, #3b82f6); color: white; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4); }
  .btn.primary:active { transform: scale(0.98); }
  .btn.ghost { background: transparent; border: 2px dashed #0ea5e9; color: #0ea5e9; }
  .btn.small { width: auto; padding: 8px 16px; font-size: 14px; border-radius: 8px; }

  /* --- AUTH TABS --- */
  .auth-tabs { display: flex; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; }
  .auth-tab { flex: 1; text-align: center; padding: 10px; font-weight: bold; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;}
  .auth-tab.active { color: #0ea5e9; border-bottom-color: #0ea5e9; }

  /* --- INPUTS --- */
  input[type="text"], input[type="password"], input[type="number"] {
    width: 100%; padding: 12px 15px; margin-bottom: 10px; border-radius: 10px;
    border: 1px solid #bae6fd; font-family: 'Quicksand', sans-serif; font-size: 15px; outline: none;
  }
  input:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2); }

  /* --- FILE DROP ZONE --- */
  .drop-zone {
    border: 3px dashed #7dd3fc; border-radius: 15px; padding: 30px 10px;
    text-align: center; cursor: pointer; background: #f0f9ff; transition: 0.3s;
  }
  .drop-zone:active { background: #e0f2fe; }

  /* --- IMAGES & TABLES IN QUESTIONS --- */
  .q-content img, .opt-content img, .exam-paper img {
    max-width: 100%;
    height: auto;
    vertical-align: middle;
    margin: 4px 2px;
    border-radius: 4px;
  }
  .q-table {
    width: 100%;
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 13px;
  }
  .q-table td, .q-table th {
    border: 1px solid #94a3b8;
    padding: 5px 8px;
    text-align: center;
  }

  /* --- PREVIEW LIST --- */
  .scroll-list { flex: 1; overflow-y: auto; padding-right: 5px; }
  .q-item { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; font-weight: 700; }
  .q-type { padding: 3px 10px; border-radius: 20px; color: white; }
  .type-mc { background: #3b82f6; } .type-tf { background: #ec4899; } .type-sa { background: #f59e0b; } .type-essay { background: #8b5cf6; }
  .type-select {
    border: 1px solid #cbd5e1; border-radius: 8px; padding: 3px 6px;
    font-family: 'Quicksand', sans-serif; font-size: 12px; font-weight: 600;
    color: #334155; background: #f8fafc; outline: none;
  }
  .q-text { font-size: 14px; margin-bottom: 10px; line-height: 1.5; }
  .opt-list { list-style: none; }
  .opt-list li { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; font-size: 13px; line-height: 1.4; }
  .opt-list li input[type="radio"] { margin-top: 3px; flex-shrink: 0; }
  
  .tf-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .tf-list li { background: #f8fafc; padding: 8px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 13px; }
  .tf-radios { display: flex; gap: 15px; margin-top: 5px; padding-left: 20px;}
  .tf-radios label { display: flex; align-items: center; gap: 4px; font-weight: 600; cursor: pointer;}

  .sa-edit input { margin-bottom: 0; padding: 8px; font-size: 13px; }

  /* --- OUTPUT PAGE --- */
  .exam-paper {
    background: white; border-radius: 10px; padding: 20px;
    font-family: "Times New Roman", serif; font-size: 14pt; line-height: 1.5;
    margin-bottom: 15px;
  }
  .exam-head { text-align: center; padding-bottom: 10px; border-bottom: 1px dashed #ccc; margin-bottom: 15px; position: relative; }
  .exam-head h2 { font-size: 16pt; text-transform: uppercase; margin-bottom: 5px; padding: 0 60px; }
  .exam-code { position: absolute; top: 0; right: 0; font-weight: bold; font-size: 11pt; }
  .section-head { text-align: center; margin: 20px 0 10px; border-bottom: 2px solid #000; padding-bottom: 5px; }
  .section-head h3 { font-size: 14pt; text-transform: uppercase; }
  .q-block { margin-bottom: 15px; }
  .opts { list-style: none; padding-left: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 5px; }
  .tf-exam { list-style: none; padding-left: 20px; margin-top: 5px; }
  .tf-exam li { display: flex; gap: 10px; margin-bottom: 5px; flex-wrap: wrap; }
  .tf-check { margin-left: auto; white-space: nowrap; }
  .watermark { text-align: center; font-size: 10pt; color: #999; margin-top: 30px; font-style: italic; }

  /* --- ANSWER KEY TABLE --- */
  #answerKeyArea { flex: 1; overflow-y: auto; padding: 15px 20px; display: none; }
  .ans-table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .ans-table th { background: #0ea5e9; color: white; padding: 10px; font-weight: bold; position: sticky; top: 0; }
  .ans-table td { padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 15px; }
  .ans-table td.num { font-weight: bold; color: #0369a1; text-align: center; width: 60px; }
  .ans-table td.ans { text-align: left; line-height: 1.6; }
  .ans-section td { background: #e0f2fe; color: #0369a1; font-weight: bold; text-align: center; font-size: 14px; }

  /* --- SIDEBAR MENU --- */
  .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; display: none; opacity: 0; transition: 0.3s; }
  .overlay.show { display: block; opacity: 1; }
  .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: white; z-index: 101; transition: 0.3s; padding: 20px; display: flex; flex-direction: column; }
  .sidebar.show { left: 0; }
  .user-info { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
  .avatar { width: 70px; height: 70px; background: #e0f2fe; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 10px; }
  .sidebar button.logout { margin-top: auto; background: #fee2e2; color: #ef4444; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-family: inherit; font-size: 16px; cursor: pointer; }
  .credit { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 15px; }
</style>
</head>
<body>

<!-- BACKGROUND ANIMATION -->
<div class="bubble" style="width:20px; height:20px; left:10%; animation-duration: 8s;"></div>

<div class="bubble" style="width:15px; height:15px; left:70%; animation-duration: 6s; animation-delay: 4s;"></div>
<div class="bubble" style="width:40px; height:40px; left:85%; animation-duration: 15s; animation-delay: 1s;"></div>

<!-- DOLPHINS -->
<svg class="dolphin dolphin-1" viewBox="0 0 100 100">

  <circle cx="70" cy="45" r="3" fill="#1e3a8a"/>
  <path d="M40,25 C45,15 55,15 60,25 Z" fill="#60a5fa"/>
</svg>

<!-- SIDEBAR MENU -->
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="avatar">🐬</div>

<!-- APP CONTAINER -->
<div class="app-container" id="appContainer" style="display: none;">

    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <h1>ExamMixer</h1>

      <button class="btn primary" style="width: 70%;" onclick="goToGenerate()">Tiếp tục: Sinh đề</button>

  </div>

  <!-- SCREEN 3: GENERATE -->
  <div class="screen" id="screen-generate">
    <div class="card">
      <h2>Cấu Hình Đề Thi</h2>

      <input type="text" id="examTitle" value="ĐỀ KIỂM TRA" placeholder="Nhập tên môn thi...">

    <div style="margin-top: auto; display: flex; gap: 10px; padding-bottom: 15px;">
      <button class="btn ghost" style="width: 30%; margin: 0;" onclick="showScreen('screen-preview')">Quay lại</button>
      <button class="btn primary" style="width: 70%;" onclick="runGenerate()">Tạo Mã Đề</button>

  <!-- SCREEN 4: RESULT -->

    <div style="padding: 10px 20px; background: #e0f2fe; display: flex; gap: 10px; overflow-x: auto;" id="tabs"></div>

</div>

<!-- AUTH MODAL (LOGIN/REGISTER) -->

  <div class="card">
    <div class="auth-tabs">
      <div id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">Đăng Nhập</div>

<script>
if (typeof pdfjsLib !== 'undefined') {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
}

// ============================================================
// CONSTANTS & MEDIA STORE
// ============================================================
const state = { parsed: [], exams: [], mediaMap: {} };
const LETTERS = ['A','B','C','D'];
const TF_LETTERS = ['a','b','c','d'];
const TYPE_LABEL = { mc:'Trắc nghiệm', tf:'Đúng/Sai', sa:'Trả lời ngắn', essay:'Tự luận' };
const SECTION_TITLE = { mc:'TRẮC NGHIỆM', tf:'ĐÚNG SAI', sa:'TRẢ LỜI NGẮN', essay:'TỰ LUẬN' };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function renderRichText(rawStr) {
  if (!rawStr) return '';
  const tokens = [];
  let safe = String(rawStr).replace(/\[\[MEDIA_(\d+)\]\]/g, (match, id) => {
    const idx = tokens.length;
    tokens.push(state.mediaMap[id] || '');
    return `__TOKEN_${idx}__`;
  });
  safe = esc(safe).replace(/\n/g, '<br>');
  safe = safe.replace(/__TOKEN_(\d+)__/g, (_, idx) => tokens[idx]);
  return safe;
}

function setStatus(msg, type) {
  const el = document.getElementById('uploadStatus');
  el.innerHTML = msg;
  el.style.color = type === 'error' ? '#dc2626' : (type === 'success' ? '#059669' : '#0284c7');
}

// ============================================================
// AUTHENTICATION
// ============================================================
function goToAuth() {
  document.getElementById('screen-welcome').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('screen-welcome').style.display = 'none';
    document.getElementById('screen-auth').style.display = 'flex';
  }, 500);
}

function switchAuthTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  document.getElementById('formLogin').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('formRegister').style.display = tab === 'register' ? 'block' : 'none';
}

function doRegister() {
  const user = document.getElementById('regUser').value.trim();
  const pass = document.getElementById('regPass').value;
  const passConfirm = document.getElementById('regPassConfirm').value;
  
  if (!user || !pass) return alert('Vui lòng nhập đầy đủ tài khoản và mật khẩu.');
  if (pass !== passConfirm) return alert('Mật khẩu nhập lại không khớp.');
  
  let accounts = JSON.parse(localStorage.getItem('exammixer_accounts') || '{}');
  if (accounts[user]) return alert('Tài khoản này đã tồn tại, vui lòng chọn tên khác.');
  
  accounts[user] = pass;
  localStorage.setItem('exammixer_accounts', JSON.stringify(accounts));
  alert('Đăng ký thành công! Hãy tiến hành đăng nhập.');
  
  switchAuthTab('login');
  document.getElementById('loginUser').value = user;
  document.getElementById('loginPass').value = '';
  document.getElementById('loginPass').focus();
}

function doLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  
  if (!user || !pass) return alert('Vui lòng nhập tài khoản và mật khẩu.');
  
  let accounts = JSON.parse(localStorage.getItem('exammixer_accounts') || '{}');
  if (!accounts[user] || accounts[user] !== pass) {
    return alert('Sai tài khoản hoặc mật khẩu!');
  }
  
  localStorage.setItem('exammixer_user', user);
  document.getElementById('sidebarUsername').textContent = user;
  document.getElementById('screen-auth').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  showScreen('screen-upload');
}

function logout() {

  location.reload();
}

function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('show');
  document.getElementById('overlay').classList.toggle('show');
}

function showScreen(id) {

}

// ============================================================
// FILE READING & GIỮ NGUYÊN HÌNH ẢNH / BẢNG BIỂU
// ============================================================
function sniffType(bytes) {
  const b = bytes; if (b.length < 4) return 'text';
  if (b[0]===0x25 && b[1]===0x50 && b[2]===0x44 && b[3]===0x46) return 'pdf';
  if (b[0]===0x50 && b[1]===0x4B && (b[2]===0x03||b[2]===0x05||b[2]===0x07)) return 'zip';
  if (b[0]===0xD0 && b[1]===0xCF && b[2]===0x11 && b[3]===0xE0) return 'ole';
  if (b[0]===0x7B && b[1]===0x5C && b[2]===0x72 && b[3]===0x74) return 'rtf';
  if (b[0]===0x89 && b[1]===0x50 && b[2]===0x4E && b[3]===0x47) return 'image';
  if (b[0]===0xFF && b[1]===0xD8 && b[2]===0xFF) return 'image';
  return 'text';
}

function extractTextWithMedia(htmlString) {
  state.mediaMap = {};
  let mediaCounter = 0;

  const div = document.createElement('div');
  div.innerHTML = htmlString;

  div.querySelectorAll('img').forEach(img => {
    const id = mediaCounter++;
    const clone = img.cloneNode(true);
    state.mediaMap[id] = clone.outerHTML;
    img.replaceWith(` [[MEDIA_${id}]] `);
  });

  div.querySelectorAll('table').forEach(tbl => {
    if (!/(?:^|\s)Câu\s*\d+\s*[.:)]/i.test(tbl.textContent)) {
      const id = mediaCounter++;
      const clone = tbl.cloneNode(true);
      clone.className = 'q-table';
      state.mediaMap[id] = clone.outerHTML;
      tbl.replaceWith(`\n[[MEDIA_${id}]]\n`);
    }
  });

  div.querySelectorAll('br').forEach(el => el.replaceWith('\n'));
  div.querySelectorAll('p, div, li, tr, h1, h2, h3, h4, td, th').forEach(el => {
    el.appendChild(document.createTextNode('\n'));
  });

  return div.textContent;
}

async function handleFile(file) {
  setStatus('⏳ Đang đọc và phân tích đề...', 'loading');
  try {
    const arrayBuffer = await file.arrayBuffer();
    const head = new Uint8Array(arrayBuffer.slice(0, Math.min(512, arrayBuffer.byteLength)));
    const kind = sniffType(head);
    
    let text = '';
    if (kind === 'pdf') {
      if (typeof pdfjsLib === 'undefined') throw new Error('Chưa tải thư viện PDF (cần mạng).');
      state.mediaMap = {};
      const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        let lastY = null;
        let pageText = '';
        for (const item of content.items) {
          const y = item.transform ? item.transform[5] : 0;
          if (lastY !== null && Math.abs(y - lastY) > 6) {
            pageText += '\n';
          } else if (pageText.length > 0 && !pageText.endsWith(' ') && !pageText.endsWith('\n')) {
            pageText += ' ';
          }
          pageText += item.str;
          lastY = y;
        }
        text += pageText + '\n';
      }
    } else if (kind === 'zip') {
      if (typeof mammoth === 'undefined') throw new Error('Chưa tải thư viện Word (cần mạng).');
      const result = await mammoth.convertToHtml({arrayBuffer});
      text = extractTextWithMedia(result.value);
    } else if (kind === 'image') {
      if (typeof Tesseract === 'undefined') throw new Error('Chưa tải thư viện OCR (cần mạng).');
      setStatus('⏳ Đang nhận diện văn bản từ ảnh...', 'loading');
      state.mediaMap = {};
      const blob = new Blob([arrayBuffer], {type: file.type});
      const url = URL.createObjectURL(blob);
      const res = await Tesseract.recognize(url, 'vie+eng');
      text = res.data.text;
    } else {
      state.mediaMap = {};
      text = new TextDecoder('utf-8').decode(arrayBuffer);
    }

    if (!text || text.trim().length < 15) throw new Error('Nội dung file quá ngắn hoặc bị lỗi font chữ.');
    
    const questions = parseExamText(text);
    if (questions.length < 1) throw new Error('Không tìm thấy câu hỏi nào. Vui lòng kiểm tra lại định dạng.');
    
    onParsed(questions);
    const imgCount = Object.keys(state.mediaMap).length;
    setStatus(`✅ Tách được ${questions.length} câu hỏi${imgCount > 0 ? ` và giữ nguyên ${imgCount} hình ảnh/bảng` : ''}.`, 'success');
  } catch (err) {
    console.error(err);
    setStatus('❌ Lỗi: ' + (err.message || 'Không thể đọc file này'), 'error');
  }
}

// ============================================================
// BỘ PHÂN TÍCH ĐỀ LINE-BY-LINE STATE MACHINE (TRIỆT ĐỂ 4 PHẦN)
// ============================================================
function normalizeExamText(rawText) {
  let text = (rawText || '')
    .replace(/\r\n/g, '\n')
    .replace(/[\u00a0\u2000-\u200b\ufeff]/g, ' ');

  text = text.replace(
    /([^\n])\s+((?:PHẦN|Phần)\s*(?:[IVX]+|\d+|[A-Z])?\s*[.:)\-]?\s*(?:TRẮC\s*NGHIỆM|ĐÚNG\s*[\/\-–—]?\s*SAI|TRẢ\s*LỜI\s*NGẮN|TỰ\s*LUẬN)[^\n]*)/gi,
    '$1\n$2'
  );
  text = text.replace(
    /([^\n])\s+((?:[IVX]+|[A-Z]|\d+)\s*[.:)\-]\s*(?:TRẮC\s*NGHIỆM(?:\s*TRẢ\s*LỜI\s*NGẮN|\s*NHIỀU\s*(?:LỰA|PHƯƠNG\s*ÁN)\s*CHỌN)?|ĐÚNG\s*[\/\-–—]?\s*SAI|TRẢ\s*LỜI\s*NGẮN|TỰ\s*LUẬN)[^\n]*)/gi,
    '$1\n$2'
  );

  text = text.replace(/([.?!…\]\)])\s+((?:Câu|Bài|Question)\s*\d+\s*[.:)])/gi, '$1\n$2');

  return text;
}

function detectLineSectionType(line) {
  const s = (line || '').trim();
  if (!s || s.length > 160) return null;
  if (/^(?:Câu|Bài|Question)\s*\d+\s*[.:)]/i.test(s)) return null;
  if (/^[a-d]\s*[.):\-]/i.test(s)) return null;

  const isHeaderPrefix = /^(?:(?:PHẦN|Phần)\s*(?:[IVX]+|\d+|[A-Z])?\s*[.:)\-]?|(?:[IVX]+|[A-Z]|\d+)\s*[.:)\-])\s*/i.test(s);
  if (!isHeaderPrefix) return null;

  const lower = s.toLowerCase();
  if (/trả\s*lời\s*ngắn|điền\s*(?:đáp|số|kết|vào|khuyết)/i.test(lower)) return 'sa';
  if (/đúng\s*[\/\-–—]*\s*sai|đ\s*[\/\-]\s*s/i.test(lower)) return 'tf';
  if (/tự\s*luận/i.test(lower)) return 'essay';
  if (/trắc\s*nghiệm|nhiều\s*(?:lựa|phương\s*án)\s*chọn|khách\s*quan/i.test(lower)) return 'mc';

  return null;
}

function looksLikeEssay(text) {
  const t = (text || '').trim();
  if (!t) return false;
  return /(?:tại\s*sao|vì\s*sao|như\s*thế\s*nào|hãy\s*cho\s*biết|trình\s*bày|phân\s*tích|chứng\s*minh|giải\s*thích|nêu\s*(?:ý\s*nghĩa|vai\s*trò|nguyên\s*nhân|đặc\s*điểm|nhận\s*xét|hậu\s*quả)|so\s*sánh|đánh\s*giá|khảo\s*sát|vẽ\s*đồ\s*thị|giải\s*(?:hệ|phương\s*trình|bài\s*toán)|viết\s*(?:đoạn\s*văn|bài\s*luận|phương\s*trình))/i.test(t);
}

function extractAnswerKey(text) {
  const pat = /(?:^|\n)[ \t]*(?:ĐÁP\s*ÁN|Đáp\s*án|ANSWER\s*KEY|HƯỚNG\s*DẪN\s*CHẤM)\b/i;
  const match = text.match(pat);
  if (!match) return { textWithoutKey: text, compactAnswers: {}, rawAnswers: {} };

  const keySection = text.substring(match.index);
  const textWithoutKey = text.substring(0, match.index);

  const compactAnswers = {};
  const compactRe = /(\d{1,3})\s*[.\-:)]\s*([A-D])(?![A-Za-zÀ-ỹ])/g;
  let mm;
  while ((mm = compactRe.exec(keySection)) !== null) {
    const num = parseInt(mm[1]);
    if (!compactAnswers[num]) compactAnswers[num] = mm[2].toUpperCase();
  }

  const rawAnswers = {};
  for (const line of keySection.split('\n')) {
    const m = line.match(/^\s*(?:Câu\s*)?(\d{1,3})\s*[.:)]\s*(.*)$/i);
    if (m) {
      const num = parseInt(m[1]);
      if (!rawAnswers[num]) rawAnswers[num] = m[2].trim();
    }
  }

  return { textWithoutKey, compactAnswers, rawAnswers };
}

function parseExamText(rawText) {
  const normalized = normalizeExamText(rawText);
  const answerKey = extractAnswerKey(normalized);
  const lines = answerKey.textWithoutKey.split('\n');

  let currentSectionType = null;
  let currentBlock = null;
  const rawBlocks = [];

  const qStartRe = /^(?:Câu|Câu\s*hỏi|CÂU|Question|Bài)\s*(\d+)\s*[.:)]\s*(.*)$/i;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();
    if (!trimmed) continue;

    const secType = detectLineSectionType(trimmed);
    if (secType) {
      if (currentBlock) {
        rawBlocks.push(currentBlock);
        currentBlock = null;
      }
      currentSectionType = secType;
      continue;
    }

    const qMatch = trimmed.match(qStartRe);
    if (qMatch) {
      if (currentBlock) {
        rawBlocks.push(currentBlock);
      }
      currentBlock = {
        num: parseInt(qMatch[1]),
        sectionType: currentSectionType,
        lines: qMatch[2].trim() ? [qMatch[2].trim()] : []
      };
      continue;
    }

    if (currentBlock) {
      currentBlock.lines.push(trimmed);
    }
  }

  if (currentBlock) {
    rawBlocks.push(currentBlock);
  }

  const questions = [];
  for (let idx = 0; idx < rawBlocks.length; idx++) {
    const blk = rawBlocks[idx];
    const bodyText = blk.lines.join('\n').trim();
    if (!bodyText) continue;

    const qObj = buildQuestionObject(blk.num, blk.sectionType, bodyText, answerKey);
    if (qObj) {
      questions.push(qObj);
    }
  }

  return questions;
}

function buildQuestionObject(num, sectionType, bodyText, answerKey) {
  if (sectionType === 'essay') {
    return {
      id: 'Q' + num + '_' + Math.random().toString(36).slice(2, 7),
      num,
      type: 'essay',
      q: bodyText
    };
  }

  const optPos = findOptionPositions(bodyText);
  if (optPos && (sectionType === 'mc' || sectionType === null)) {
    return parseMC(num, optPos, answerKey);
  }

  const tfParsed = parseTF(bodyText, num);
  if (tfParsed && (sectionType === 'tf' || sectionType === null)) {
    return tfParsed;
  }

  if (sectionType === 'sa') {
    return parseSA(bodyText, num, answerKey);
  }

  if (looksLikeEssay(bodyText)) {
    return {
      id: 'Q' + num + '_' + Math.random().toString(36).slice(2, 7),
      num,
      type: 'essay',
      q: bodyText
    };
  }

  return parseSA(bodyText, num, answerKey);
}

function findOptionPositions(rawText) {
  const text = rawText.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
  const matches = [];
  const re = /(?:^|\s)([A-D])\s*[\.\):]\s*(?=\S)/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const letterPos = m.index + m[0].indexOf(m[1]);
    const beforeChar = letterPos > 0 ? text[letterPos - 1] : ' ';
    if (beforeChar === ' ' || letterPos === 0) {
      matches.push({ letter: m[1], index: letterPos, contentStart: m.index + m[0].length });
    }
  }

  if (matches.length < 4) return null;

  let bestTuple = null;
  for (let i = 0; i < matches.length; i++) {
    if (matches[i].letter !== 'A') continue;
    let a = matches[i];
    if (a.index < 4) continue;

    let bIdx = matches.findIndex((x, idx) => idx > i && x.letter === 'B' && x.index > a.contentStart);
    if (bIdx === -1) continue;
    let b = matches[bIdx];
    
    let cIdx = matches.findIndex((x, idx) => idx > bIdx && x.letter === 'C' && x.index > b.contentStart);
    if (cIdx === -1) continue;
    let c = matches[cIdx];
    
    let dIdx = matches.findIndex((x, idx) => idx > cIdx && x.letter === 'D' && x.index > c.contentStart);
    if (dIdx === -1) continue;
    let d = matches[dIdx];

    if (d.index - a.index < 3000) {
      bestTuple = { A: a.index, B: b.index, C: c.index, D: d.index, flatText: text };
    }
  }
  return bestTuple;
}

function parseMC(num, optPositions, answerKey) {
  const q = optPositions.flatText.substring(0, optPositions.A).trim();
  const opts = [];
  const positions = [optPositions.A, optPositions.B, optPositions.C, optPositions.D];
  for (let i = 0; i < 4; i++) {
    const start = positions[i], end = i < 3 ? positions[i+1] : optPositions.flatText.length;
    let optStr = optPositions.flatText.substring(start, end).trim();
    optStr = optStr.replace(/^[A-D]\s*[\.\):]\s*/, '').trim();
    opts.push(optStr);
  }
  let correct = 0;
  const c = answerKey.compactAnswers ? answerKey.compactAnswers[num] : null;
  if (c) correct = c.charCodeAt(0) - 65;
  else if (answerKey.rawAnswers && answerKey.rawAnswers[num]) {
    const m = answerKey.rawAnswers[num].match(/[A-D]/i);
    if (m) correct = m[0].toUpperCase().charCodeAt(0) - 65;
  }
  return {
    id: 'Q' + num + '_' + Math.random().toString(36).slice(2, 7),
    num,
    type: 'mc',
    q,
    opts,
    correct
  };
}

function parseTF(rawText, num) {
  const lines = rawText.split('\n');
  const subMatches = [];
  let currentOffset = 0;

  for (const line of lines) {
    const m = line.match(/^[ \t]*([a-d])\s*[.):\-]\s*(.+)$/i);
    if (m) {
      const letter = m[1].toLowerCase();
      const content = m[2].trim();
      if (content.length >= 2) {
        subMatches.push({
          letter,
          start: currentOffset,
          contentStart: currentOffset + line.indexOf(m[2])
        });
      }
    }
    currentOffset += line.length + 1;
  }

  if (subMatches.length < 3 || subMatches.length > 5 || subMatches[0].letter !== 'a') {
    return null;
  }

  const q = rawText.substring(0, subMatches[0].start).trim();
  const subs = [];

  for (let i = 0; i < Math.min(4, subMatches.length); i++) {
    const endPos = i + 1 < subMatches.length ? subMatches[i + 1].start : rawText.length;
    let seg = rawText.substring(subMatches[i].contentStart, endPos).trim();
    let subCorrect = null;
    const patterns = [
      /\s*[-–—]\s*(Đúng|Sai|Đ|S)\s*\.?\s*$/i,
      /\s*\(\s*(Đúng|Sai|Đ|S)\s*\)\s*\.?\s*$/i,
      /\s+(Đúng|Sai)\s*\.?\s*$/i
    ];
    for (const p of patterns) {
      const m = seg.match(p);
      if (m) {
        const val = m[1].toLowerCase();
        subCorrect = (val === 'đúng' || val === 'đ');
        seg = seg.replace(m[0], '').trim();
        break;
      }
    }
    subs.push({ text: seg, correct: subCorrect !== null ? subCorrect : true });
  }

  while (subs.length < 4) {
    subs.push({ text: '', correct: true });
  }

  return {
    id: 'Q' + num + '_' + Math.random().toString(36).slice(2, 7),
    num,
    type: 'tf',
    q,
    subs
  };
}

function parseSA(text, num, answerKey) {
  let q = text, answer = '';
  const ansMatch = q.match(/(?:Đáp\s*án|ĐÁP\s*ÁN|Đáp\s*số|ĐÁP\s*SỐ|Answer|Kết\s*quả)\s*[:.]?\s*(.+?)\s*$/im);
  if (ansMatch) {
    answer = ansMatch[1].trim();
    q = q.replace(ansMatch[0], '').trim();
  } else if (answerKey.rawAnswers && answerKey.rawAnswers[num]) {
    answer = answerKey.rawAnswers[num].trim();
  }
  return {
    id: 'Q' + num + '_' + Math.random().toString(36).slice(2, 7),
    num,
    type: 'sa',
    q,
    answer
  };
}

// ============================================================
// PREVIEW RENDERING & EVENTS
// ============================================================
function onParsed(questions) {
  state.parsed = questions;
  renderPreview();
  showScreen('screen-preview');
}

function changeQuestionType(id, newType) {
  const q = state.parsed.find(x => x.id === id);
  if (!q || q.type === newType) return;
  q.type = newType;
  if (newType === 'mc' && (!q.opts || q.opts.length !== 4)) {
    q.opts = ['Đáp án A', 'Đáp án B', 'Đáp án C', 'Đáp án D'];
    q.correct = 0;
  } else if (newType === 'tf' && (!q.subs || q.subs.length !== 4)) {
    q.subs = [
      { text: 'Mệnh đề a', correct: true },
      { text: 'Mệnh đề b', correct: true },
      { text: 'Mệnh đề c', correct: false },
      { text: 'Mệnh đề d', correct: false }
    ];
  } else if (newType === 'sa' && q.answer == null) {
    q.answer = '';
  }
  renderPreview();
}

function renderPreview() {
  const list = document.getElementById('questionList');
  let html = '';
  const groups = { mc:[], tf:[], sa:[], essay:[] };
  state.parsed.forEach(q => { if(groups[q.type]) groups[q.type].push(q); });
  
  ['mc','tf','sa','essay'].forEach(t => {
    if(!groups[t].length) return;
    groups[t].forEach((q, i) => {
      let body = '';
      try {
        if(t==='mc' && q.opts && q.opts.length > 0) {
          body = `<ul class="opt-list">${q.opts.map((o,j)=>`
            <li><input type="radio" name="q_${q.id}" ${q.correct===j?'checked':''} onchange="updateCorrect('${q.id}', 'mc', ${j})"> <span class="opt-content"><b>${LETTERS[j]}.</b> ${renderRichText(o)}</span></li>
          `).join('')}</ul>`;
        }
        else if(t==='tf' && q.subs && q.subs.length > 0) {
          body = `<ul class="tf-list">${q.subs.map((s,j)=>`
            <li>
              <div class="opt-content" style="margin-bottom: 4px;"><b>${TF_LETTERS[j]})</b> ${renderRichText(s.text)}</div>
              <div class="tf-radios">
                <label><input type="radio" name="tf_${q.id}_${j}" value="true" ${s.correct===true?'checked':''} onchange="updateTF('${q.id}', ${j}, true)"> Đúng</label>
                <label><input type="radio" name="tf_${q.id}_${j}" value="false" ${s.correct===false?'checked':''} onchange="updateTF('${q.id}', ${j}, false)"> Sai</label>
              </div>
            </li>
          `).join('')}</ul>`;
        }
        else if(t==='sa') {
          body = `<div class="sa-edit"><input type="text" placeholder="Nhập đáp án..." value="${esc(q.answer)}" onchange="updateSA('${q.id}', this.value)"></div>`;
        } else {
          body = `<div style="font-size: 12px; color: #7c3aed;">(Câu tự luận - giáo viên tự chấm)</div>`;
        }
      } catch (e) {
        console.error('Lỗi hiển thị câu:', q, e);
        body = `<div style="color: red; font-size: 12px;">Lỗi định dạng câu hỏi này.</div>`;
      }
      
      html += `<div class="q-item">
        <div class="q-header">
          <span class="q-type type-${q.type}">${TYPE_LABEL[q.type]||'Khác'}</span>
          <select class="type-select" onchange="changeQuestionType('${q.id}', this.value)">
            <option value="mc" ${q.type==='mc'?'selected':''}>Trắc nghiệm</option>
            <option value="tf" ${q.type==='tf'?'selected':''}>Đúng/Sai</option>
            <option value="sa" ${q.type==='sa'?'selected':''}>Trả lời ngắn</option>
            <option value="essay" ${q.type==='essay'?'selected':''}>Tự luận</option>
          </select>
        </div>
        <div class="q-text q-content"><b>Câu ${i+1}.</b> ${renderRichText(q.q)}</div>
        ${body}
      </div>`;
    });
  });
  list.innerHTML = html;
  document.getElementById('previewSummary').textContent =
    `Tìm thấy ${state.parsed.length} câu (${groups.mc.length} TN • ${groups.tf.length} Đ/S • ${groups.sa.length} TLN • ${groups.essay.length} TL).`;
}

function updateCorrect(id, type, val) { const q = state.parsed.find(x => x.id === id); if(q) q.correct = val; }
function updateTF(id, subIdx, val) { const q = state.parsed.find(x => x.id === id); if(q && q.subs) q.subs[subIdx].correct = val; }
function updateSA(id, val) { const q = state.parsed.find(x => x.id === id); if(q) q.answer = val; }

function goToGenerate() {
  showScreen('screen-generate');
}

// ============================================================
// GENERATE & DOWNLOAD
// ============================================================
function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function runGenerate() {
  const title = document.getElementById('examTitle').value || 'ĐỀ KIỂM TRA';
  const numCodes = parseInt(document.getElementById('numCodes').value) || 2;
  const doShuffleQ = document.getElementById('chkShuffleQ').checked;
  const doShuffleOpt = document.getElementById('chkShuffleOpt').checked;
  
  state.exams = [];
  for(let i = 0; i < numCodes; i++) {
    let clonedQuestions = state.parsed.map(q => {
      const copy = JSON.parse(JSON.stringify(q));
      if (doShuffleOpt) {
        if (copy.type === 'mc' && copy.opts && copy.opts.length === 4) {
          const indexed = copy.opts.map((opt, idx) => ({ opt, isCorrect: idx === copy.correct }));
          const mixed = shuffleArray(indexed);
          copy.opts = mixed.map(x => x.opt);
          copy.correct = mixed.findIndex(x => x.isCorrect);
        } else if (copy.type === 'tf' && copy.subs && copy.subs.length === 4) {
          copy.subs = shuffleArray(copy.subs);
        }
      }
      return copy;
    });

    if (doShuffleQ) {
      clonedQuestions = shuffleArray(clonedQuestions);
    }

    state.exams.push({ code: 101 + i, questions: clonedQuestions, title: title });
  }

  renderResult();
  showScreen('screen-result');
  if(document.getElementById('examArea').style.display === 'none') toggleResultMode();
}

function renderResult() {
  const tabs = document.getElementById('tabs');
  const area = document.getElementById('examArea');
  
  tabs.innerHTML = state.exams.map((e, i) => 
    `<button class="btn small ${i===0?'primary':'ghost'}" style="margin:0; white-space:nowrap;" onclick="switchTab(${i})">Mã ${e.code}</button>`
  ).join('');

  area.innerHTML = state.exams.map((e, i) => {
    let qHtml = '';
    const groups = { mc:[], tf:[], sa:[], essay:[] };
    e.questions.forEach(q => { if(groups[q.type]) groups[q.type].push(q); });

    ['mc','tf','sa','essay'].forEach((t, k) => {
      if(!groups[t].length) return;
      qHtml += `<div class="section-head"><h3>PHẦN ${t==='mc'?'I':t==='tf'?'II':t==='sa'?'III':'IV'}. ${SECTION_TITLE[t]}</h3></div>`;
      groups[t].forEach((q, idx) => {
        try {
          qHtml += `<div class="q-block"><b>Câu ${idx+1}.</b> ${renderRichText(q.q)}`;
          if(t==='mc' && q.opts) qHtml += `<ul class="opts">${q.opts.map((o,j)=>`<li><b>${LETTERS[j]}.</b> ${renderRichText(o)}</li>`).join('')}</ul>`;
          if(t==='tf' && q.subs) qHtml += `<ul class="tf-exam">${q.subs.map((s,j)=>`<li><span><b>${TF_LETTERS[j]})</b> ${renderRichText(s.text)}</span> <span class="tf-check">☐ Đúng ☐ Sai</span></li>`).join('')}</ul>`;
          if(t==='sa') qHtml += `<div style="padding-left:20px; font-style:italic; margin-top:4px;">Trả lời: ........................</div>`;
          qHtml += `</div>`;
        } catch(e) { console.warn('Lỗi render câu xuất file:', q); }
      });
    });

    return `<div class="exam-paper" id="exam-page-${i}" style="display: ${i===0?'block':'none'}">
      <div class="exam-head">
        <div class="exam-code">Mã đề: ${e.code}</div>
        <h2>${esc(e.title)}</h2>
      </div>
      ${qHtml}
      <div class="watermark">Phát triển bởi Nayroda</div>
    </div>`;
  }).join('');

  renderAnswerKeyArea();
}

function switchTab(idx) {
  document.querySelectorAll('.exam-paper').forEach((p, i) => p.style.display = i===idx ? 'block' : 'none');
  document.querySelectorAll('#tabs .btn').forEach((b, i) => {
    b.className = `btn small ${i===idx?'primary':'ghost'}`;
    b.style.margin = '0'; b.style.whiteSpace = 'nowrap';
  });
  renderAnswerKeyArea();
}

function renderAnswerKeyArea() {
  const table = document.getElementById('answerTable');
  const activeIdx = Array.from(document.querySelectorAll('.exam-paper')).findIndex(p => p.style.display === 'block');
  if (activeIdx < 0) return;
  const activeExam = state.exams[activeIdx];
  
  let html = `<tr><th>Câu</th><th>Đáp án (Mã ${activeExam.code})</th></tr>`;
  
  const groups = { mc:[], tf:[], sa:[], essay:[] };
  activeExam.questions.forEach(q => { if(groups[q.type]) groups[q.type].push(q); });

  ['mc','tf','sa','essay'].forEach((t, k) => {
    if(!groups[t].length) return;
    
    const partStr = `PHẦN ${t==='mc'?'I':t==='tf'?'II':t==='sa'?'III':'IV'}. ${SECTION_TITLE[t]}`;
    html += `<tr class="ans-section"><td colspan="2">${partStr}</td></tr>`;

    groups[t].forEach((q, idx) => {
      let ans = '';
      if (q.type === 'mc') ans = `<b>${LETTERS[q.correct]}</b>`;
      else if (q.type === 'tf') ans = q.subs.map((s, j) => `${TF_LETTERS[j]}) ${s.correct ? 'Đ' : 'S'}`).join(' &nbsp;&nbsp; ');
      else if (q.type === 'sa') ans = `<b>${esc(q.answer)}</b>`;
      else if (q.type === 'essay') ans = `<i>Giáo viên tự chấm</i>`;
      
      html += `<tr>
        <td class="num">${idx + 1}</td>
        <td class="ans">${ans}</td>
      </tr>`;
    });
  });
  
  table.innerHTML = html;
}

function backToConfig() {
  document.getElementById('examArea').style.display = 'block';
  document.getElementById('answerKeyArea').style.display = 'none';
  document.getElementById('btnDownload').innerText = 'Tải Word';
  document.getElementById('btnDownload').onclick = downloadWord;
  document.getElementById('btnToggleMode').innerText = 'Xem đáp án';
  document.getElementById('btnToggleMode').style.background = 'linear-gradient(135deg, #10b981, #059669)';
  
  showScreen('screen-generate');
}

function toggleResultMode() {
  const isExamMode = document.getElementById('examArea').style.display !== 'none';
  
  if (isExamMode) {
    document.getElementById('examArea').style.display = 'none';
    document.getElementById('answerKeyArea').style.display = 'block';
    
    const btnDl = document.getElementById('btnDownload');
    btnDl.innerText = 'Tải Excel';
    btnDl.onclick = downloadExcel;
    
    const btnToggle = document.getElementById('btnToggleMode');
    btnToggle.innerText = 'Xem đề';
    btnToggle.style.background = 'linear-gradient(135deg, #0ea5e9, #3b82f6)';
  } else {
    document.getElementById('examArea').style.display = 'block';
    document.getElementById('answerKeyArea').style.display = 'none';
    
    const btnDl = document.getElementById('btnDownload');
    btnDl.innerText = 'Tải Word';
    btnDl.onclick = downloadWord;
    
    const btnToggle = document.getElementById('btnToggleMode');
    btnToggle.innerText = 'Xem đáp án';
    btnToggle.style.background = 'linear-gradient(135deg, #10b981, #059669)';
  }
}

function buildWordHtml(innerContent) {
  const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>De thi</title><style>body { font-family: 'Times New Roman', serif; font-size: 14pt; } .exam-head { text-align: center; } .exam-code { float: right; font-weight: bold; } .section-head { text-align: center; font-weight: bold; margin: 15px 0; border-bottom: 1px solid #000; } .q-block { margin-bottom: 15px; } .opts { list-style: none; padding-left: 20px; } .opts li { display: inline-block; width: 48%; vertical-align: top; } .tf-check { float: right; } .q-table { border-collapse: collapse; margin: 8px 0; } .q-table td, .q-table th { border: 1px solid #000; padding: 4px 8px; } img { max-width: 100%; height: auto; vertical-align: middle; } .watermark { text-align: center; font-size: 10pt; color: #999; margin-top: 20px; font-style: italic; }</style></head><body>`;
  const footer = "</body></html>";
  return header + innerContent + footer;
}

function buildExcelHtml() {
  let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"></head><body>`;
  html += `<table border="1"><tr><th>Câu</th>`;
  state.exams.forEach(e => { html += `<th>Mã ${e.code}</th>`; });
  html += `</tr>`;

  const groups = { mc:[], tf:[], sa:[], essay:[] };
  if(state.exams.length > 0) state.exams[0].questions.forEach(q => { if(groups[q.type]) groups[q.type].push(q); });

  ['mc','tf','sa','essay'].forEach((t) => {
    if(!groups[t].length) return;
    const partStr = `PHẦN ${t==='mc'?'I':t==='tf'?'II':t==='sa'?'III':'IV'}. ${SECTION_TITLE[t]}`;
    html += `<tr><td colspan="${state.exams.length + 1}" style="background:#e0f2fe; font-weight:bold;">${partStr}</td></tr>`;
    
    const count = groups[t].length;
    for(let i=0; i<count; i++) {
        html += `<tr><td>Câu ${i+1}</td>`;
        state.exams.forEach(e => {
            const eqGroups = { mc:[], tf:[], sa:[], essay:[] };
            e.questions.forEach(q => { if(eqGroups[q.type]) eqGroups[q.type].push(q); });
            const q = eqGroups[t][i];
            
            let ans = '';
            if (q) {
                if (q.type === 'mc') ans = LETTERS[q.correct];
                else if (q.type === 'tf') ans = q.subs.map(s => s.correct ? 'Đ' : 'S').join(' ');
                else if (q.type === 'sa') ans = q.answer;
                else if (q.type === 'essay') ans = 'TL';
            }
            html += `<td>${esc(ans)}</td>`;
        });
        html += `</tr>`;
    }
  });

  html += `</table></body></html>`;
  return html;
}

function downloadWord() {
  const activeIdx = Array.from(document.querySelectorAll('.exam-paper')).findIndex(p => p.style.display === 'block');
  const content = document.getElementById(`exam-page-${activeIdx}`).innerHTML;
  const sourceHTML = buildWordHtml(content);
  const blob = new Blob([sourceHTML], {type: 'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `DeThi_Ma${state.exams[activeIdx].code}.doc`;
  a.click();
  URL.revokeObjectURL(url);
}

function downloadExcel() {
  const html = buildExcelHtml();
  const blob = new Blob([html], {type: 'application/vnd.ms-excel'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `DapAn_TronDe.xls`;
  a.click();
  URL.revokeObjectURL(url);
}

async function downloadAllZip() {
  if (!state.exams || !state.exams.length) return alert('Chưa có mã đề nào được tạo.');
  if (typeof JSZip === 'undefined') return alert('Chưa tải được thư viện nén ZIP (cần kết nối mạng).');

  const btn = document.getElementById('btnDownloadAll');
  const oldText = btn.innerText;
  btn.disabled = true;
  btn.innerText = '⏳ Đang đóng gói .zip...';

  try {
    const zip = new JSZip();
    for (let i = 0; i < state.exams.length; i++) {
      const pageEl = document.getElementById(`exam-page-${i}`);
      const content = pageEl ? pageEl.innerHTML : '';
      const docHtml = buildWordHtml(content);
      zip.file(`DeThi_Ma${state.exams[i].code}.doc`, docHtml);
    }
    zip.file('DapAn_TronDe.xls', buildExcelHtml());

    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `BoDeThi_Va_DapAn.zip`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    console.error(err);
    alert('Lỗi khi tạo file ZIP: ' + (err.message || err));
  } finally {
    btn.disabled = false;
    btn.innerText = oldText;
  }
}
